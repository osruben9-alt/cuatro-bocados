<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9b6a2f"><title>Cuatro Bocados · Encargos</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f8f5ef;--card:#fffdf9;--ink:#201d19;--muted:#7d766d;--line:#e8e0d5;--accent:#a87532;--accent2:#ead9bd;--ok:#2f8a58;--warn:#c88925;--danger:#bb4b4b;--shadow:0 10px 30px rgba(60,42,20,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:84px}.appTop{padding:18px 18px 8px;display:flex;align-items:center;gap:12px}.logo{width:72px;height:48px;object-fit:contain;mix-blend-mode:multiply}.appTop h1{font-size:17px;margin:0}.appTop small{color:var(--muted)}.avatar{margin-left:auto;background:var(--accent);color:white;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-weight:700}.screen{padding:8px 16px}.hero{background:linear-gradient(135deg,#f0e3cf,#fffdf9);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.hero h2{margin:0 0 4px;font-size:25px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-appTop:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.primary{width:100%;border:0;border-radius:15px;background:var(--accent);color:#fff;padding:14px 16px;font-weight:700;margin-appTop:14px;box-shadow:0 7px 18px rgba(168,117,50,.22)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}.sectionhead h3{margin:0;font-size:19px}.link{border:0;background:none;color:var(--accent);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.flavor{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(60,42,20,.05);text-align:left;padding:0}.flavor img{width:100%;height:120px;object-fit:cover;background:#eee}.flavor .ft{padding:10px 11px;font-weight:700;display:flex;justify-content:space-between}.plus{height:164px;display:grid;place-items:center;border:1px dashed #cdbb9f;background:#fffaf2;color:var(--accent)}.plus div{text-align:center}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;background:rgba(255,253,249,.96);backdrop-filter:blur(14px);border-appTop:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav{border:0;background:none;color:#8a847c;font-size:10px;padding:5px}.nav b{display:block;font-size:20px;line-height:22px;margin-bottom:2px}.nav.active{color:var(--accent);font-weight:700}.back{border:0;background:none;font-size:22px}.titlebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.titlebar h2{font-size:22px;margin:0}.form{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffdf9;outline:none}.field textarea{min-height:90px;resize:vertical}.qty{display:flex;align-items:center;gap:12px}.qty button{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:22px}.qty input{text-align:center}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 11px;font-size:12px}.chip.sel{background:#f1e2cc;border-color:#d7b986;color:#704b1f}.order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px}.order .row{display:flex;justify-content:space-between;gap:10px}.order h4{margin:0 0 4px;font-size:15px}.muted{color:var(--muted);font-size:12px}.badge{font-size:11px;border-radius:20px;padding:5px 8px;background:#f4e6d2;color:#76501e;white-space:nowrap}.badge.ok{background:#e3f3e9;color:#287449}.badge.red{background:#f9e5e5;color:#9f3f3f}.tabs{display:flex;gap:6px;overflow:auto;margin:0 0 12px}.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:12px;white-space:nowrap}.tab.active{background:#f1e2cc;color:#704b1f;border-color:#d7b986;font-weight:700}.empty{text-align:center;color:var(--muted);padding:35px 15px}.userbox{display:flex;gap:8px;margin:10px 0}.user{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;text-align:center;font-size:12px}.user.active{border-color:var(--accent);background:#f4e7d4;font-weight:700}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#24211d;color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.smallbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12px}.calendar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calgrid div{padding:8px 2px;font-size:12px;border-radius:9px}.dow{color:var(--muted);font-weight:700}.has{background:#f3e5d1;color:#704b1f;font-weight:700}.today{outline:2px solid var(--accent)}.settings{display:grid;gap:10px}.setting{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.setting b{display:block;margin-bottom:5px}.danger{color:var(--danger)}
</style></head><body>
<div class="app" id="app"></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://tbnziiborrtfdsmeqrmz.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRibnppaWJvcnJ0ZmRzbWVxcm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNjcxMzYsImV4cCI6MjEwMzc0MzEzNn0.3eH-yna_LAFW7Hkq7o-tZKlrFDtFIKeD8VJyA1NN3BM";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const flavors=["Clásica","Lotus","Oreo","Kinder Bueno","Pistacho","Galletas Dinosaurios","Snickers","Nutella","Happy Hippo","Tiramisú","Torrija"];
const imgs={"Clásica":"clasica.jpg",
"Lotus":"lotus.png",
"Oreo":"oreo.jpg",
"Kinder Bueno":"kinder bueno.jpg",
"Pistacho":"tarta de queso y pistacho-1.jpg",
"Galletas Dinosaurios":"galleta dinosaurios.jpg",
"Snickers":"snickers.jpg",
"Nutella":"nutella.jpg",
"Happy Hippo":"happy hippo.jpg",
"Tiramisú":"tiramisu.jpg",
"Torrija":"torrija caramelizada.jpg"};
let state={page:'home',user:null,orders:[],selectedFlavor:null,editing:null,tartas:[]};
const today=new Date().toISOString().slice(0,10), tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value; supabaseClient.auth.signInWithPassword({email,password}).then(async r=>{if(r.error){toast(r.error.message);return}await boot()})}
function loginPage(){return `<div class="screen"><section class="hero"><h2>CUATRO BOCADOS</h2><p>Acceso a gestión de encargos</p><div class="form"><div class="field"><label>CORREO</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>CONTRASEÑA</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" onclick="login()">ENTRAR</button></div></section></div>`}
async function logout(){await supabaseClient.auth.signOut();state.user=null;state.orders=[];render()}
async function loadData(){const u=state.user;const [t,r]=await Promise.all([supabaseClient.from('tartas').select('id,nombre,descripcion,precio,activa').eq('activa',true).order('id'),supabaseClient.from('reservas').select('id,cliente_nombre,cliente_telefono,fecha_entrega,hora_entrega,tarta_id,cantidad,precio,observaciones,estado,usuario_id,creada_en,tartas:tarta_id(id,nombre),usuarios:usuario_id(id,nombre)').order('fecha_entrega').order('hora_entrega')]);if(t.error||r.error){toast((t.error||r.error).message);return}state.tartas=t.data||[];state.orders=r.data||[]}
function appTop(){return `<header class="appTop"><img class="logo" src="logo.jpg"><div><h1>CUATRO BOCADOS</h1><small>Gestión de encargos</small></div><div class="avatar">${state.user.nombre[0]}</div><button class="logout" onclick="logout()">Salir</button></header>`}
function nav(){return `<nav class="bottom">${[['home','⌂','Inicio'],['flavors','🍰','Tartas'],['agenda','▣','Agenda'],['production','♨','Producción'],['clients','♙','Clientes']].map(x=>`<button class="nav ${state.page===x[0]?'active':''}" onclick="setPage('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}
function setPage(p){state.page=p;state.selectedFlavor=null;state.editing=null;render()}
function flavorCard(f){return `<button class="flavor" onclick="newOrder('${f.replace(/'/g,"\\'")}')"><img src="${imgs[f]||''}" onerror="this.style.display='none'"><div class="ft"><span>${f}</span><span>›</span></div></button>`}
function home(){const td=state.orders.filter(o=>o.fecha_entrega===today),tm=state.orders.filter(o=>o.fecha_entrega===tomorrow);return `<div class="screen"><section class="hero"><h2>Hola, ${state.user.nombre}</h2><p>${fmt(today)}</p><div class="stats"><div class="stat"><b>${td.length}</b><span>encargos hoy</span></div><div class="stat"><b>${tm.length}</b><span>encargos mañana</span></div><div class="stat"><b>${state.orders.filter(o=>new Date(o.fecha_entrega)>=new Date(today)&&new Date(o.fecha_entrega)<new Date(today).getTime()+7*86400000).reduce((s,o)=>s+o.cantidad,0)}</b><span>tartas esta semana</span></div></div><button class="primary" onclick="setPage('flavors')">＋ NUEVO ENCARGO</button></section><div class="sectionhead"><h3>Nuestras tartas</h3><button class="link" onclick="setPage('flavors')">Ver todas</button></div><div class="grid">${state.tartas.slice(0,4).map(f=>flavorCard(f.nombre)).join('')}</div></div>`}
function flavorsPage(){return `<div class="screen"><div class="titlebar"><button class="back" onclick="setPage('home')">‹</button><h2>Nuestras tartas</h2></div><p class="muted">Toca un sabor para crear un nuevo encargo.</p><div class="grid">${state.tartas.map(f=>flavorCard(f.nombre)).join('')}</div></div>`}
function newOrder(f){state.selectedFlavor=f;state.page='form';render()}
function formPage(){let o=state.editing||{fecha_entrega:tomorrow,cantidad:1,cliente_nombre:'',cliente_telefono:'',hora_entrega:'18:00',observaciones:''};let t=state.tartas.find(x=>String(x.nombre).trim()===String(state.selectedFlavor).trim());let precio=t?.precio||0;let total=precio*(+o.cantidad||1);return `<div class="screen"><div class="titlebar"><button class="back" onclick="setPage('flavors')">‹</button><h2>${state.selectedFlavor}</h2></div><div class="form"><div class="field"><label>PRECIO POR UNIDAD</label><div style="font-size:22px;font-weight:800">${precio} €</div></div><div class="field"><label>FECHA DE RECOGIDA</label><input id="date" type="date" value="${o.fecha_entrega}"></div><div class="field"><label>CANTIDAD</label><div class="qty"><button onclick="changeQty(-1)">−</button><input id="qty" type="number" min="1" value="${o.cantidad}"><button onclick="changeQty(1)">＋</button></div></div><div class="field"><label>TOTAL</label><div id="totalPrice" style="font-size:26px;font-weight:800">${total} €</div></div><div class="field"><label>A NOMBRE DE</label><input id="customer" value="${o.cliente_nombre||''}"></div><div class="field"><label>TELÉFONO</label><input id="phone" type="tel" value="${o.cliente_telefono||''}"></div><div class="field"><label>HORA DE RECOGIDA</label><input id="time" type="time" value="${o.hora_entrega||'18:00'}"></div><div class="field"><label>OBSERVACIONES</label><textarea id="notes">${o.observaciones||''}</textarea></div><button class="primary" onclick="saveOrder()">✓ GUARDAR ENCARGO</button></div></div>`}
function changeQty(n){const q=document.getElementById('qty');q.value=Math.max(1,(+q.value||1)+n);const t=state.tartas.find(x=>x.nombre===state.selectedFlavor);const total=(t?.precio||0)*(+q.value||1);const el=document.getElementById('totalPrice');if(el)el.textContent=total+' €'}
async function saveOrder(){const t=state.tartas.find(x=>x.nombre===state.selectedFlavor);const cantidad=+document.getElementById('qty').value;const precio=t.precio;const payload={cliente_nombre:document.getElementById('customer').value.trim()||'Sin nombre',cliente_telefono:document.getElementById('phone').value.trim(),fecha_entrega:document.getElementById('date').value,hora_entrega:document.getElementById('time').value,tarta_id:t.id,cantidad:cantidad,precio:precio,observaciones:document.getElementById('notes').value.trim(),estado:'pendiente',usuario_id:state.user.id};let r=state.editing?await supabaseClient.from('reservas').update(payload).eq('id',state.editing.id):await supabaseClient.from('reservas').insert(payload);if(r.error){toast(r.error.message);return}await loadData();toast('Encargo guardado');setPage('agenda')}
function orderCard(o){const total=(o.precio||0)*(o.cantidad||1);const creado=o.creada_en?new Date(o.creada_en).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—';return `<div class="order" onclick="viewOrder(${o.id})"><div class="row"><div><h4>${(o.hora_entrega||'').slice(0,5)} · ${o.cliente_nombre}</h4><div>${o.tartas?.nombre||'Tarta'} × ${o.cantidad} · <b>${total} €</b></div><div class="muted">📅 ${fmt(o.fecha_entrega)} · Registrado por ${o.usuarios?.nombre||'—'} · 🕐 ${creado}</div></div><span class="badge ${o.estado==='recogida'?'ok':''}">${o.estado}</span></div></div>`}function agenda(){const l=state.orders.slice().sort((a,b)=>(a.fecha_entrega+a.hora_entrega).localeCompare(b.fecha_entrega+b.hora_entrega));return `<div class="screen"><div class="titlebar"><h2>Agenda</h2></div><div id="agendaList">${l.length?l.map(orderCard).join(''):'<div class="empty">Todavía no hay encargos.<br><button class="primary" onclick="setPage(\'flavors\')">Crear primer encargo</button></div>'}</div></div>`}
function viewOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const estadoTexto=o.estado==='entregada'?'Recogido':'Pendiente';const botonTexto=o.estado==='pendiente'?'✓ Marcar como recogido':'↩ Volver a pendiente';const precio=o.precio||0;const total=precio*(o.cantidad||1);document.getElementById('app').innerHTML=appTop()+`<div class="screen"><div class="titlebar"><button class="back" onclick="setPage('agenda')">‹</button><h2>Detalle</h2></div><div class="hero"><h2>${o.tartas?.nombre||'Tarta'} × ${o.cantidad}</h2><p>${o.cliente_nombre}</p><div style="margin-top:14px;display:grid;gap:9px"><div>💶 Precio por unidad: <b>${precio} €</b></div><div>💰 TOTAL: <b>${total} €</b></div><div>📅 ${fmt(o.fecha_entrega)}</div><div>🕐 ${(o.hora_entrega||'').slice(0,5)}</div><div>📞 ${o.cliente_telefono||'Sin teléfono'}</div><div>👤 Registrado por <b>${o.usuarios?.nombre||'—'}</b></div><div>🕐 Registrado a las <b>${o.creada_en?new Date(o.creada_en).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—'}</b></div><div>🏷️ Estado: <b>${estadoTexto}</b></div>${o.observaciones?`<div>📝 ${o.observaciones}</div>`:''}</div><button class="primary" onclick="toggleStatus(${o.id},'${o.estado}')">${botonTexto}</button><button class="secondary" onclick="deleteOrder(${o.id})">Eliminar encargo</button></div></div>${nav()}`}
async function toggleStatus(id,status){const nuevoEstado=status==='pendiente'?'entregada':'pendiente';const r=await supabaseClient.from('reservas').update({estado:nuevoEstado}).eq('id',id);if(r.error){toast(r.error.message);return}await loadData();setPage('agenda')}
async function deleteOrder(id){if(!confirm('¿Eliminar este encargo?'))return;const r=await supabaseClient.from('reservas').delete().eq('id',id);if(r.error){toast(r.error.message);return}await loadData();setPage('agenda')}
function production(){const days=[today,tomorrow];return `<div class="screen"><div class="titlebar"><h2>Producción</h2></div>${days.map((d,i)=>{const l=state.orders.filter(o=>o.fecha_entrega===d&&o.estado!=='Recogido'),s={};l.forEach(o=>s[o.tartas?.nombre||'Tarta']=(s[o.tartas?.nombre||'Tarta']||0)+o.cantidad);return `<div class="hero" style="margin-bottom:12px"><h2 style="font-size:19px">${i?'Mañana':'Hoy'}</h2><p>${fmt(d)}</p><div style="font-size:28px;font-weight:800;margin-appTop:10px">${l.reduce((a,o)=>a+o.cantidad,0)} tartas</div>${Object.entries(s).map(([f,q])=>`<div class="order" style="margin-appTop:8px;margin-bottom:0"><div class="row"><b>${f}</b><b>${q}</b></div></div>`).join('')||'<div class="empty">Sin producción pendiente.</div>'}</div>`}).join('')}</div>`}
function clients(){const m={};state.orders.forEach(o=>{const k=o.cliente_telefono||o.cliente_nombre;m[k]??={name:o.cliente_nombre,phone:o.cliente_telefono,count:0,cakes:0};m[k].count++;m[k].cakes+=o.cantidad});return `<div class="screen"><div class="titlebar"><h2>Clientes</h2></div>${Object.values(m).sort((a,b)=>b.count-a.count).map(c=>`<div class="order"><h4>${c.name}</h4><div class="muted">${c.phone||'Sin teléfono'} · ${c.count} encargos · ${c.cakes} tartas</div></div>`).join('')||'<div class="empty">Los clientes aparecerán aquí al guardar reservas.</div>'}</div>`}
function render(){if(!state.user){document.getElementById('app').innerHTML=loginPage();return}const c=state.page==='home'?home():state.page==='flavors'?flavorsPage():state.page==='form'?formPage():state.page==='agenda'?agenda():state.page==='production'?production():clients();document.getElementById('app').innerHTML=appTop()+c+nav()}
async function boot(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user){render();return}const r=await supabaseClient.from('usuarios').select('id,nombre,auth_user_id').eq('auth_user_id',user.id).maybeSingle();if(r.error||!r.data){toast('La cuenta no está vinculada a Cuatro Bocados');return}state.user=r.data;await loadData();render()}
render();boot();
</script>
<script>

render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
