<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9b6a2f">
<title>Cuatro Bocados · Encargos</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f5ef;color:#201d19;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:85px}
.top{padding:18px;display:flex;align-items:center;gap:12px}
.top h1{font-size:18px;margin:0}.top small{color:#7d766d}
.avatar{margin-left:auto;background:#a87532;color:white;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-weight:bold}
.screen{padding:8px 16px}
.hero{background:linear-gradient(135deg,#f0e3cf,#fffdf9);border:1px solid #e8e0d5;border-radius:24px;padding:18px}
.hero h2{margin:0 0 5px;font-size:25px}.hero p{color:#7d766d}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}
.stat{background:white;border:1px solid #e8e0d5;border-radius:15px;padding:12px 5px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#7d766d}
.primary{width:100%;border:0;border-radius:15px;background:#a87532;color:white;padding:14px;font-weight:bold;margin-top:14px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}
.sectionhead h3{margin:0}.link{border:0;background:none;color:#a87532;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.flavor{background:#fffdf9;border:1px solid #e8e0d5;border-radius:18px;padding:16px;text-align:left;font-weight:bold;min-height:75px}
.flavor span:last-child{float:right;font-size:20px;color:#a87532}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;background:#fffdf9;border-top:1px solid #e8e0d5;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px}
.nav{border:0;background:none;color:#888;font-size:10px}.nav b{display:block;font-size:20px}.nav.active{color:#a87532;font-weight:bold}
.titlebar{display:flex;align-items:center;gap:8px;margin-bottom:15px}.titlebar h2{margin:0}
.back{border:0;background:none;font-size:28px}
.userbox{display:flex;gap:7px;margin:5px 0 15px}.user{flex:1;border:1px solid #e8e0d5;background:white;border-radius:12px;padding:9px}.user.active{border-color:#a87532;background:#f1e2cc;font-weight:bold}
.form{background:white;border:1px solid #e8e0d5;border-radius:20px;padding:14px}
.field{margin-bottom:13px}.field label{display:block;font-size:11px;color:#7d766d;font-weight:bold;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid #e8e0d5;border-radius:12px;padding:12px;background:#fffdf9;font:inherit}
.field textarea{min-height:90px}.qty{display:flex;gap:10px;align-items:center}.qty button{width:42px;height:42px;border:1px solid #e8e0d5;background:white;border-radius:12px;font-size:22px}.qty input{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #e8e0d5;background:white;border-radius:20px;padding:9px;font-size:12px}.chip.sel{background:#f1e2cc;border-color:#d7b986}
.order{background:white;border:1px solid #e8e0d5;border-radius:18px;padding:13px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:10px}.order h4{margin:0 0 5px}
.muted{color:#7d766d;font-size:12px}.badge{font-size:11px;border-radius:20px;padding:5px 8px;background:#f4e6d2;white-space:nowrap}.badge.ok{background:#e3f3e9;color:#287449}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tab{border:1px solid #e8e0d5;background:white;border-radius:20px;padding:8px 12px}.tab.active{background:#f1e2cc;font-weight:bold}
.empty{text-align:center;color:#7d766d;padding:35px 10px}
</style>
</head>

<cuerpo>
<div class="app">
<div id="app"></div>
</div>

<script>
const sabores=[
"Clásica","Lotus","Oreo","Kinder Bueno","Pistacho",
"Galletas Dinosaurios","Snickers","Nutella","Happy Hippo",
"Tiramisú","Torrija"
];

const usuarios=["Oscar","Rubén","Anay"];

sea ​​estado={
página:"inicio",
usuario:localStorage.cbUser||"Oscar",
pedidos:JSON.parse(localStorage.cbOrders||"[]"),
Sabor seleccionado: nulo
};

función guardar(){
localStorage.cbOrders=JSON.stringify(state.orders);
localStorage.cbUser=estado.usuario;
}

función hoy(){
sea ​​d=new Date();
return d.toISOString().slice(0,10);
}

función mañana(){
sea ​​d=new Date();
d.setDate(d.getDate()+1);
return d.toISOString().slice(0,10);
}

función fmt(fecha){
return new Date(date+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
}

función setPage(page){
state.page =página;
prestar();
}

función superior(){
devolver `
<header class="top">
<div>
<h1>CUATRO BOCADOS</h1>
<small>Gestión de encargos</small>
</div>
<div class="avatar">${state.user[0]}</div>
</header>`;
}

función nav(){
devolver `
<nav class="bottom">
<button class="nav ${ state.page ==="home"?"active":""}" onclick="setPage('home')"><b>⌂</b>Inicio</button>
<button class="nav ${ state.page ==="flavors"?"active":""}" onclick="setPage('flavors')"><b>🍰</b>Tartas</button>
<button class="nav ${ state.page ==="agenda"?"active":""}" onclick="setPage('agenda')"><b>▣</b>Agenda</button>
<button class="nav ${ state.page ==="production"?"active":""}" onclick="setPage('production')"><b>♨</b>Producción</button>
<button class="nav ${ state.page ==="clients"?"active":""}" onclick="setPage('clients')"><b>♙</b>Clientes</button>
</nav>`;
}

función userSwitcher(){
devolver `<div class="userbox">
${users.map(u=>`
<button class="user ${state.user===u?"active":""}" onclick="changeUser('${u}')">${u}</button>
`).join("")}
</div>`;
}

función cambiarUsuario(u){
estado.usuario=u;
ahorrar();
prestar();
}

función flavorCard(f){
return `<button class="flavor" onclick="newOrder('${f}')">${f}<span>›</span></button>`;
}

función home(){
let td=state.orders.filter(o=>o.date===today());
let tm=state.orders.filter(o=>o.date===tomorrow());
let week=state.orders.filter(o=>{
sea ​​x=(new Date(o.date)-new Date(today()))/86400000;
devolver x>=0&&x<7;
});

devolver `
<div class="screen">
${userSwitcher()}
<section class="hero">
<h2>Hola, ${state.user}</h2>
<p>${fmt(today())}</p>
<div class="stats">
<div class="stat"><b>${td.length}</b><span>encargos hoy</span></div>
<div class="stat"><b>${tm.length}</b><span>mañana</span></div>
<div class="stat"><b>${week.reduce((s,o)=>s+o.qty,0)}</b><span>tartas semana</span></div>
</div>
<button class="primary" onclick="setPage('flavors')">＋ NUEVO ENCARGO</button>
</section>

<div class="sectionhead">
<h3>Nuestras tartas</h3>
<button class="link" onclick="setPage('flavors')">Ver todas</button>
</div>

<div class="grid">${flavors.slice(0,6).map(flavorCard).join("")}</div>
</div>`;
}

función flavorsPage(){
devolver `
<div class="screen">
<div class="titlebar">
<button class="back" onclick="setPage('home')">‹</button>
<h2>Nuestras tartas</h2>
</div>
<p class="muted">Toca una tarta para crear un nuevo encargo.</p>
<div class="grid">${flavors.map(flavorCard).join("")}</div>
</div>`;
}

función nuevoOrden(f){
estado.saborSeleccionado=f;
state.page ="formulario";
prestar();
}

función formPage(){
devolver `
<div class="screen">
<div class="titlebar">
<button class="back" onclick="setPage('flavors')">‹</button>
<h2>${state.selectedFlavor}</h2>
</div>

<div class="form">
<div class="field">
<label>FECHA DE RECOGIDA</label>
<input id="date" type="date" value="${tomorrow()}">
</div>

<div class="field">
<label>CANTIDAD</label>
<div class="qty">
<button onclick="changeQty(-1)">−</button>
<input id="qty" type="number" min="1" value="1">
<button onclick="changeQty(1)">＋</button>
</div>
</div>

<div class="field">
<label>EL NOMBRE DE</label>
<input id="cliente" placeholder="Nombre del cliente">
</div>

<div class="field">
<label>TELÉFONO</label>
<input id="phone" type="tel" placeholder="600 000 000">
</div>

<div class="field">
<label>HORA DE RECOGIDA</label>
<input id="time" type="time" value="18:00">
</div>

<div class="field">
<label>RECOGIDA</label>
<select id="pickup">
<opción>Local</opción>
<option>Otro lugar</option>
</seleccionar>
</div>

<div class="field">
<label>EXTRAS</label>
<div class="chips">
${["Dedicatoria","Velas","Caja especial","Decoración","Entrega","Otro"].map(x=>
`<button type="button" class="chip" onclick="this.classList.toggle('sel')">${x}</button>`).join("")}
</div>
</div>

<div class="field">
<label>OBSERVACIONES</label>
<textarea id="notes" placeholder="Cualquier detalle importante..."></textarea>
</div>

<button class="primary" onclick="saveOrder()">✓ GUARDAR ENCARGO</button>
</div>
</div>`;
}

función changeQty(n){
let q=document.getElementById("qty");
q.valor = Math.max(1, (Número(q.valor) || 1) + n);
}

función guardarOrden(){
let extras=[...document.querySelectorAll(".chip.sel")].map(x=>x.textContent);

sea ​​orden={
id:Fecha.ahora(),
sabor:estado.selectivoSabor,
fecha:document.getElementById("fecha").value,
cantidad:Número(documento.getElementById("qty").value),
cliente:document.getElementById("cliente").value.trim()||"Sin nombre",
teléfono:document.getElementById("phone").value.trim(),
hora:document.getElementById("time").value,
recogida:document.getElementById("recogida").value,
extras:extras,
notas:document.getElementById("notes").value.trim(),
creadoPor:estado.usuario,
estado:"Pendiente"
};

estado.órdenes.push(orden);
ahorrar();
state.page "agenda";
prestar();
}

función agenda(){
let list=state.orders.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

devolver `
<div class="screen">
<div class="titlebar"><h2>Agenda</h2></div>

<div class="tabs">
<button class="tab active" onclick="agendaFilter('all')">Todos</button>
<button class="tab" onclick="agendaFilter('today')">Hoy</button>
<button class="tab" onclick="agendaFilter('tomorrow')">Mañana</button>
</div>

<div id="agendaList">
${list.length?list.map(orderCard).join(""):`<div class="empty">Todavía no hay encargos.<br><br><button class="primary" onclick="setPage('flavors')">Crear primer encargo</button></div>`}
</div>
</div>`;
}

función orderCard(o){
devolver `
<div class="order" onclick="viewOrder(${ o.id })">
<div class="row">
<div>
<h4>${o.time} · ${o.customer}</h4>
<div>${o.flavor} × ${o.qty}</div>
<div class="muted">${fmt(o.date)} · ${o.pickup} · Registrado por ${o.createdBy}</div>
</div>
<span class="badge ${o.status==="Recogido"?"ok":""}">${o.status}</span>
</div>
</div>`;
}

función agendaFilter(tipo){
sea ​​lista=estado.pedidos;

if(kind==="today") list=list.filter(o=>o.date===today());
if(kind==="tomorrow") list=list.filter(o=>o.date===tomorrow());

lista = lista.slice().sort((a,b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));

document.getElementById("agendaList").innerHTML=
list.length?list.map(orderCard).join(""):`<div class="empty">No hay encargos para este día.</div>`;
}

función viewOrder(id){
let o=state.orders.find(x=> x.id ===id);
si(!o)regresar;

document.getElementById("app").innerHTML=top()+`
<div class="screen">
<div class="titlebar">
<button class="back" onclick="setPage('agenda')">‹</button>
<h2>Detalles</h2>
</div>

<div class="hero">
<h2>${o.flavor} × ${o.qty}</h2>
<p>${o.customer}</p>
<div class="muted">
📅 ${fmt(o.date)}<br><br>
🕐 ${o.time}<br><br>
📞 ${o.phone||"Sin teléfono"}<br><br>
📍 ${o.pickup}<br><br>
👤 Registrado por <b>${o.createdBy}</b><br><br>
🏷️ Estado: <b>${o.status}</b>
</div>

<button class="primary" onclick="toggleStatus(${ o.id })">
${o.status==="Pendiente"?" ✓ Marcar como recogido":"↩ Volver a pendiente"}
</button>

<button class="primary" style="background:#bb4b4b" onclick="deleteOrder(${ o.id })">
Eliminar encargo
</button>
</div>
</div>${nav()}`;
}

función alternarEstado(id){
let o=state.orders.find(x=> x.id ===id);
o.status=o.status==="Pendiente"?"Recogido":"Pendiente";
ahorrar();
setPage("agenda");
}

función deleteOrder(id){
if(confirm("¿Eliminar este encargo?")){
estado.pedidos = estado.pedidos.filtrar(x => x.id !== id);
ahorrar();
setPage("agenda");
}
}

función producción(){
sea ​​días=[hoy(),mañana()];

devolver `
<div class="screen">
<div class="titlebar"><h2>Producción</h2></div>

${days.map((d,i)=>{
let list=state.orders.filter(o=>o.date===d&&o.status!=="Recogido");
sea ​​sumas={};

lista.forEach(o=>{
suma[o.flavor]=(suma[o.flavor]||0)+o.qty;
});

devolver `
<div class="hero" style="margin-bottom:12px">
<h2 style="font-size:19px">${i?"Mañana":"Hoy"}</h2>
<p>${fmt(d)}</p>
<h2>${list.reduce((s,o)=>s+o.qty,0)} tartas</h2>
${Object.entries(sums).map(([f,q])=>`
<div class="order">
<div class="row"><b>${f}</b><b>${q}</b></div>
</div>`).join("")||
`<div class="empty">Sin producción pendiente.</div>`}
</div>`;
}).unirse("")}
</div>`;
}

función clientes(){
sea ​​mapa={};

estado.órdenes.paraCada(o=>{
let key=o.phone||o.customer;

si(!map[clave]){
mapa[clave]={nombre:o.cliente,teléfono:o.teléfono,cantidad:0,pasteles:0};
}

mapa[clave].count++;
mapa[clave].pasteles+=o.qty;
});

devolver `
<div class="screen">
<div class="titlebar"><h2>Clientes</h2></div>

${Object.values(map).map(c=>`
<div class="order">
<h4>${ c.name }</h4>
<div class="muted">${c.phone||"Sin teléfono"} · ${c.count} encargos · ${c.cakes} tartas</div>
</div>`).join("")||
`<div class="empty">Los clientes aparecerán aquí al guardar encargos.</div>`}
</div>`;
}

función render(){
dejar contenido=
state.page ==="inicio"?inicio():
state.page ==="sabores"?páginasdesabores():
state.page ==="formulario"?formPage():
state.page ==="agenda"?agenda():
state.page ==="producción"?producción():
clientela();

document.getElementById("app").innerHTML=top()+content+nav();
}

prestar();

if("serviceWorker" en el navegador){
navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
